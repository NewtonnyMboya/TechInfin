name: Build TechInfin Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'app.js'
      - 'supabase-client-config.js'
      - 'supabase-marketplace.js'
      - 'styles.css'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android app module from repository sources
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www app/src/main/java/com/infinitycybertech/techinfin
          cp index.html app/src/main/assets/www/index.html
          cp app.js app/src/main/assets/www/app.js
          cp styles.css app/src/main/assets/www/styles.css
          cp supabase-client-config.js app/src/main/assets/www/supabase-client-config.js
          cp supabase-marketplace.js app/src/main/assets/www/supabase-marketplace.js
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.infinitycybertech.techinfin'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.infinitycybertech.techinfin'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="TechInfin"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/infinitycybertech/techinfin/MainActivity.java <<'EOF'
          package com.infinitycybertech.techinfin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  if (state == null) webView.loadUrl("file:///android_asset/www/index.html");
                  else webView.restoreState(state);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
              @Override protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (webView != null) webView.saveState(out);
              }
              @Override protected void onDestroy() {
                  if (webView != null) { webView.destroy(); webView = null; }
                  super.onDestroy();
              }
          }
          EOF
      - name: Check marketplace JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-marketplace.js
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechInfin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
