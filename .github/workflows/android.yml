name: Build TechInfin Android APK
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'app.js'
      - 'supabase-client-config.js'
      - 'supabase-marketplace.js'
      - 'styles.css'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'app.js'
      - 'supabase-client-config.js'
      - 'supabase-marketplace.js'
      - 'styles.css'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android app module from repository sources
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www app/src/main/java/com/infinitycybertech/techinfin app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="512dp" android:height="512dp"
              android:viewportWidth="512" android:viewportHeight="512">
              <path android:fillColor="#080D1B" android:pathData="M0,0h512v512h-512z"/>
              <path android:fillColor="#00000000" android:strokeColor="#086BFF" android:strokeWidth="34" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M66,258 C66,155 188,130 256,256 C324,382 446,357 446,254 C446,151 324,130 256,256 C188,382 66,361 66,258"/>
              <path android:fillColor="#00000000" android:strokeColor="#12DDEB" android:strokeWidth="24" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M68,258 C68,170 183,143 256,256 C329,369 444,346 444,254"/>
              <path android:fillColor="#00000000" android:strokeColor="#A62CFF" android:strokeWidth="18" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M256,256 C329,143 444,166 444,254 C444,342 329,369 256,256"/>
              <path android:fillColor="#16E8F0" android:pathData="M283,225 L440,158 L417,219 L477,195 L461,292 L431,251 L390,305 L283,225z"/>
              <path android:fillColor="#D8FFFF" android:pathData="M256,224 L289,256 L256,288 L223,256z"/>
              <path android:fillColor="#11DCEB" android:pathData="M244,36h24v95h-24z M126,70h20v70h-20z M366,70h20v70h-20z M244,381h24v95h-24z"/>
              <path android:fillColor="#11DCEB" android:pathData="M116,80a20,20 0,1 0,40 0a20,20 0,1 0,-40 0 M356,80a20,20 0,1 0,40 0a20,20 0,1 0,-40 0 M236,28a20,20 0,1 0,40 0a20,20 0,1 0,-40 0 M236,476a20,20 0,1 0,40 0a20,20 0,1 0,-40 0"/>
          </vector>
          EOF
          cp index.html app/src/main/assets/www/index.html
          cp app.js app/src/main/assets/www/app.js
          cp styles.css app/src/main/assets/www/styles.css
          cp supabase-client-config.js app/src/main/assets/www/supabase-client-config.js
          cp supabase-marketplace.js app/src/main/assets/www/supabase-marketplace.js
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.infinitycybertech.techinfin'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.infinitycybertech.techinfin'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="TechInfin"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/infinitycybertech/techinfin/MainActivity.java <<'EOF'
          package com.infinitycybertech.techinfin;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  if (state == null) webView.loadUrl("file:///android_asset/www/index.html");
                  else webView.restoreState(state);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
              @Override protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (webView != null) webView.saveState(out);
              }
              @Override protected void onDestroy() {
                  if (webView != null) { webView.destroy(); webView = null; }
                  super.onDestroy();
              }
          }
          EOF
      - name: Check marketplace JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-marketplace.js
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TechInfin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
