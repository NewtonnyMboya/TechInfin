name: Validate TechInfin backend
on:
  push:
    branches: [ main, master, 'ci/**' ]
    paths:
      - 'supabase/**'
      - 'scanner-service/**'
      - '.github/workflows/backend-validation.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'scanner-service/**'
      - '.github/workflows/backend-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Edge Function TypeScript
        run: |
          deno check supabase/functions/seller-upload-url/index.ts
          deno check supabase/functions/verify-software/index.ts
          deno check supabase/functions/software-download/index.ts
          deno check supabase/functions/create-order/index.ts
          deno check supabase/functions/mpesa-stk-push/index.ts
          deno check supabase/functions/mpesa-callback/index.ts
          deno check supabase/functions/payment-status/index.ts
      - name: Install scanner test dependencies
        run: python -m pip install --disable-pip-version-check -r scanner-service/requirements.txt
      - name: Compile scanner service and tests
        run: |
          python -m py_compile scanner-service/server.py
          python -m py_compile scanner-service/tests/test_scanner.py
      - name: Run scanner security regression tests
        run: python -m unittest discover -s scanner-service/tests -v

  scanner-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ClamAV scanner image
        uses: docker/build-push-action@v6
        with:
          context: scanner-service
          file: scanner-service/Dockerfile
          tags: techinfin-clamav:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify ClamAV detects the harmless EICAR test signature
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh techinfin-clamav:ci -c '
            set -eu
            freshclam
            printf "%b" "\\130\\065\\117\\041\\120\\045\\100\\101\\120\\133\\064\\134\\120\\132\\130\\065\\064\\050\\120\\136\\051\\067\\103\\103\\051\\067\\175\\044\\105\\111\\103\\101\\122\\055\\123\\124\\101\\116\\104\\101\\122\\104\\055\\101\\116\\124\\111\\126\\111\\122\\125\\123\\055\\124\\105\\123\\124\\055\\106\\111\\114\\105\\041\\044\\110\\053\\110\\052" > /tmp/eicar.com
            set +e
            clamscan --no-summary /tmp/eicar.com
            result=$?
            set -e
            if [ "$result" -ne 1 ]; then
              echo "Expected ClamAV exit code 1 (infected), received $result"
              exit 1
            fi
            echo "EICAR test signature detected as expected."
          '
